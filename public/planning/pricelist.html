<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>몽글 · 요금표 스튜디오</title><link rel="stylesheet" href="price-studio.css"></head><body>
<header><div><a href="./">← 서비스 기획</a><h1>우리 가게 요금표 스튜디오</h1></div><div class="save-status" id="save-status" role="status">저장 공간 확인 중…</div><div class="header-actions"><button id="undo" title="마지막 변경 되돌리기">↶ 되돌리기</button><button id="redo">↷ 다시</button><button id="export-csv">CSV 내보내기</button><button id="export-json">전체 백업</button><label class="file-button">불러오기<input hidden type="file" id="import" accept=".csv,.json,text/csv,application/json"></label><button class="primary" id="download">PNG 다운로드</button></div></header>
<div id="message" role="alert"></div><div class="filebar"><span>자동 저장은 이 기기의 현재 브라우저에 저장됩니다. CSV는 요금 내용, 전체 백업은 로고·색·배치까지 보관합니다.</span><button id="connect-csv">CSV 파일에 자동 저장 연결</button><span id="csv-status" role="status"></span></div>
<main><aside class="layers"><div class="panel-title"><h2>섹션 · 레이어</h2><small>⠿를 끌거나 ↑↓로 이동</small></div><div id="section-list"></div><div class="add-section"><select id="section-kind" aria-label="추가할 섹션 종류"><option value="matrix">견종별 가격표</option><option value="cat">고양이 미용</option><option value="list">추가금 · 가격 목록</option><option value="text">안내 문구</option></select><button id="add-section">＋ 섹션 추가</button></div><div class="panel-title"><h2>서비스 열 순서</h2><small>모든 견종표의 가격이 함께 이동해요</small></div><div id="column-list"></div><button class="wide" id="add-column">＋ 서비스 열</button><p class="hint">섹션을 누르면 가운데에서 내용을 편집합니다. 고양이·추가금·설명도 독립된 섹션입니다.</p></aside>
<section class="editor"><nav aria-label="편집 항목"><button data-tab="content" aria-selected="true">내용 편집</button><button data-tab="design" aria-selected="false">전체 디자인</button><button data-tab="brand" aria-selected="false">매장 · 로고</button></nav><div id="editor-content"></div></section>
<aside class="preview-area"><div class="preview-toolbar"><h2>미리보기</h2><select id="format" aria-label="출력 크기"><option value="content">내용에 맞춘 길이</option><option value="portrait">A4 비율</option></select><button id="zoom">확대</button></div><div id="render-error" role="status"></div><div class="canvas-shell"><canvas id="preview" role="img" aria-label="요금표 미리보기"></canvas></div><p id="size-note" class="hint"></p><div class="mobile-actions"><button id="show-editor">편집</button><button id="show-preview">미리보기</button><button class="primary" id="download-mobile">PNG 저장</button></div></aside></main>
<script type="module" src="price-studio.js"></script></body></html>
