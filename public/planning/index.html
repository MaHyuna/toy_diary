const state={day:29,registrationFrom:'booking',screen:'calendar',stage:'reserved',paid:false,created:false,ledgerTab:'visits',name:'두부',guardian:'김보호',weight:'6.2',time:'10:00',service:'전체 미용',extra:false,confirmed:false,note:'얼굴은 동그랗게, 귀는 짧게 정리',photos:false};

function setTab(tab){currentTab=tab;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));render();window.scrollTo({top:0,behavior:'instant'});}

function flow(){return `<section class="panel"><span class="eyebrow">01 / THE WORKING DAY</span><h2 style="margin-top:12px">하나의 방문이 예약부터 재방문까지 이어져요.</h2><p class="lede">전화로 예약을 받고, 아이의 지난 스타일을 확인하고, 미용을 마쳐 결제받는 하루. 같은 정보를 여러 메뉴에 다시 적지 않도록 설계합니다.</p><div class="flow">${[['예약 받기','반려견 · 시간 · 서비스 · 견적','booking'],['당일 확인','시간순 일정 · 주의사항','day'],['미용 진행','작업 메모 · 사진 · 추가 작업','visit'],['미용 완료','작업 마침 · 아직 미결제 가능','visit'],['결제 확인','실제 금액 · 수단 · 날짜','payment'],['다음 방문','지난 사진 · 메모에서 재예약','pet']].map((s,i)=>`<button data-go="${s[2]}" ${i===3?'data-stage="completed"':''}><span class="num">0${i+1}</span><strong>${s[0]}</strong><small>${s[1]}</small></button>`).join('')}</div><p class="small">각 단계를 누르면 관련 화면 시안으로 이동합니다. 시안은 가상 데이터만 사용하며 입력·결제 내역을 저장하지 않습니다.</p></section><section class="panel"><span class="eyebrow">NEW / PRICE LIST STUDIO</span><h3 style="margin-top:12px">우리 가게 로고와 색으로 요금표를 꾸며요.</h3><p class="small">가격 안내표 → 로고·배경·테두리 선택 → 미리보기 → 이미지 다운로드</p><a class="btn" href="./pricelist.html">요금표 꾸미기 체험 →</a></section><div class="two"><section class="panel"><h3>미용 완료 ≠ 결제 완료</h3><div class="state-row"><span class="pill">예약 확정</span>→<span class="pill">미용 중</span>→<span class="pill done">미용 완료</span></div><div class="state-row"><span class="pill pay">미결제</span>→<span class="pill done">결제 완료</span></div><p class="small">미용을 끝내고 인계를 기다릴 때는 ‘미용 완료 / 미결제’. 결제 확인을 해야 실제 받은 금액이 장부에 기록됩니다.</p></section><section class="panel"><h3>샴푸는 먼저 매장 비용으로 정의해요.</h3><div class="policy">일반 샴푸 → 기본 미용 가격에 포함하는 안<br>샴푸 구입 → 운영비 기록<br>사용량 원가 → 원하면 보는 내부 참고값</div><p class="small">특정 유료 관리 메뉴가 실제 존재하는지는 확인할 사항입니다. 샴푸를 사용했다는 이유로 고객 추가금을 자동 청구하지 않습니다.</p></section></div><section class="panel"><h3>메뉴는 네 가지 역할로 정리합니다.</h3><div class="journey"><div><strong>예약</strong><p>오늘 누구를 언제 미용하나요?</p></div><div><strong>고객</strong><p>어떤 아이이며 지난 스타일은?</p></div><div><strong>장부</strong><p>얼마를 받았고 무엇이 미결제인가요?</p></div><div><strong>매장</strong><p>우리 가게 요금과 운영 기준은?</p></div></div></section>`;}
function catalog(){return `<div class="review-title"><div><h2>화면마다 하나의 역할을 정합니다.</h2><p>P는 페이지, S는 현재 맥락을 유지하는 하단 창입니다.</p></div>${button('처음부터 체험','calendar','btn soft')}</div><div class="catalog">${pages.map(p=>`<button data-go="${p.id}"><small>${p.code} · ${p.kind}</small><strong>${p.name}</strong><span>${p.purpose}</span><i>${p.action} →</i></button>`).join('')}</div>`;}
function calendar(){return `<div class="period"><span><small>2026년</small>10월</span><button data-action="month-note">‹　오늘　›</button></div><div class="week">${['일','월','화','수','목','금','토'].map(d=>`<span>${d}</span>`).join('')}</div><div class="dates">${'<span></span>'.repeat(4)}${Array.from({length:31},(_,i)=>{const d=i+1,busy=d%7!==5;return `<button data-go="day" data-day="${d}" class="${d===state.day?'sel':''}"><b>${d}</b><small>${busy?(d===29?'3':d%3+1)+'건':''}</small><em>${busy?money(d===29?245000:80000*(d%3+1)):''}</em></button>`}).join('')}</div><div class="cal-note"><span>금액은 예약 견적 합계</span><span>단위 · 원</span></div>`;}

case 'visit':return `<div class="pet-head"><div class="avatar">♧</div><div><h3>${esc(state.name)}</h3><p>비숑 · ${esc(state.weight)}kg · ${esc(state.guardian)} 보호자</p></div></div><p class="muted">10월 29일 · ${esc(state.time)}–12:00 · 전체 미용</p><div class="state-row"><span class="pill done">${status()}</span><span class="pill ${state.paid?'done':'pay'}">${state.paid?'결제 완료':'미결제'}</span></div><div class="caution"><b>미용 전 확인</b><br>발을 만질 때 예민함 · 드라이 소리에 놀랄 수 있음</div>${quote()}<h4 class="section-title">이번 방문의 사진 · 작업 기록</h4><p class="muted">${esc(state.note)}</p><div class="photo-slots"><div class="photo-slot"><strong>＋</strong><span>${state.photos?'미용 전 사진 자리':'미용 전 사진'}</span></div><div class="photo-slot"><strong>＋</strong><span>${state.photos?'미용 후 사진 자리':'미용 후 사진'}</span></div></div>${button('작업 기록 · 추가 작업 수정','work','btn outline block')}${state.paid?button('다음 예약 잡기','booking','btn soft block'):''}`;
case 'work':return `<p class="muted">${esc(state.name)} · 10월 29일 방문</p><label class="field">이번 미용 스타일 · 메모<textarea id="work-note">${esc(state.note)}</textarea></label><div class="photo-slots"><button class="photo-slot" data-action="photo"><strong>＋</strong><span>미용 전 사진 자리</span></button><button class="photo-slot" data-action="photo"><strong>＋</strong><span>미용 후 사진 자리</span></button></div><p class="muted">기획 시안에서는 실제 파일을 업로드하지 않아요. 사진은 이 방문에 연결하는 구조입니다.</p><h4 class="section-title">추가 작업이 있었나요?</h4><label class="muted"><input type="checkbox" id="extra-check" ${state.extra?'checked':''}> 심한 엉킴 제거 · 10,000원</label><p class="muted">추가금은 매장 기준에 따른 예시입니다.</p><label class="muted"><input type="checkbox" id="confirm-check" ${state.confirmed?'checked':''}> 추가 작업·금액을 보호자에게 확인받음</label><button class="btn block" data-action="save-work">작업 기록 저장</button><p class="muted">사진이나 원액 사용량이 없어도 미용을 완료할 수 있어요.</p>`;

case 'pet':return `<div class="pet-head"><div class="avatar">♧</div><div><h3>${esc(state.name)}</h3><p>비숑 · ${esc(state.weight)}kg · ${esc(state.guardian)} 보호자</p></div></div><div class="caution"><b>주의사항</b><br>발 만질 때 예민함 · 선호: 동그란 얼굴</div><h4 class="section-title">최근 방문 · 10월 29일</h4><p class="muted">전체 미용 · ${money(amount())}원 · ${state.paid?'결제 완료':'미결제'}</p><div class="photo-slots"><div class="photo-slot"><strong>▧</strong><span>그날의 스타일 사진 자리</span></div><div class="photo-slot"><strong>▧</strong><span>이전 방문 사진 자리</span></div></div><p class="muted">사진은 프로필과 방문별로 구분해요. ${esc(state.note)}</p>${button('이 방문 자세히','visit','btn outline block')}${button('이 아이 다음 예약','booking','btn block')}`;

case 'expense':return calendar()+sheet('운영비 기록',`<label class="field">날짜<input type="date" value="2026-10-${String(state.day).padStart(2,'0')}"></label><label class="field">분류<select><option>샴푸 구매</option><option>임대료</option><option>소모품</option></select></label><label class="field">실제 쓴 금액<input type="number" value="35000"></label><label class="field">내용<input placeholder="예: 저자극 샴푸 1통"></label><button class="btn block" data-action="save-expense">비용 기록</button>`,'ledger');
case 'shop':return `<div class="shop-hero"><img src="../images/studio-art.webp" alt="몽글 미용실 일러스트"><div><h3>우리 가게의<br>다정한 기준.</h3></div></div>${button('고객용 가격 안내표　›','prices','shop-link')}<button class="shop-link" data-action="price-edit-note">요금 편집　›</button><button class="shop-link" data-action="optional-cost">소모품 원가 · 선택 관리　›</button><p class="muted">샴푸 구입비는 장부의 운영비 기록에서 남겨요. 사용량은 매번 입력하는 필수 항목이 아닙니다.</p>`;
case 'designer':return `<div class="shop-hero"><img src="../images/studio-art.webp" alt="요금표 디자인 예시"><div><h3>우리 가게만의<br>요금 안내표.</h3></div></div><div class="line"><span>① 매장 정보</span><b>이름 · 로고</b></div><div class="line"><span>② 디자인</span><b>색 · 테두리 · 장식</b></div><div class="line"><span>③ 미리보기</span><b>선택한 디자인 확인</b></div><div class="line"><span>④ 다운로드</span><b>고화질 PNG</b></div><p class="muted">3개 기본 스타일에서 시작해 직접 꾸며요. 세로형·정사각형을 고르고, 로고를 올려 실제 이미지를 내려받을 수 있는 별도 체험 화면입니다.</p><a class="btn block" href="./pricelist.html">요금표 꾸미기 체험 열기 →</a>`;
case 'priceEdit':return calendar()+sheet('요금 편집',`<p class="muted">이 화면은 저장 규칙을 검토하는 양식 시안입니다.</p><label class="field">서비스 이름<input value="전체 미용"></label><div class="field-pair"><label class="field">기본가 (원)<input type="number" value="65000"></label><label class="field">소요 시간 (분)<input type="number" value="120"></label></div><label class="field">견종 기준<input value="비숑 · 추가 10,000원"></label><label class="field">몸무게 기준<input value="5kg 이상 10kg 미만 · 추가 5,000원"></label><div class="policy">저장 시 이후 새 견적에 적용합니다. 이미 받은 예약과 결제 금액은 바꾸지 않아요.</div><button class="btn block" data-action="price-save-preview">저장 후 화면 보기</button>`,'prices');
case 'share':return calendar()+sheet('고객에게 보이는 가격표',`<div class="quote"><b>몽글 미용실 · 미용 가격 안내</b><div><span>전체 미용</span><b>65,000원</b></div><div><span>비숑 추가금</span><b>10,000원</b></div><div><span>5kg 이상 10kg 미만</span><b>5,000원</b></div><div class="total"><span>두부 예상 금액</span><b>80,000원</b></div></div><p class="muted">기본 샴푸 포함. 현장 추가 작업은 상담 후 안내합니다.</p><p class="muted">이 영역이 고객용 이미지가 되는 구조입니다. 원가나 내부 고객 메모는 담지 않아요.</p><button class="btn block" data-action="share-final-note">이미지 저장 · 기기 공유 위치</button>`,'prices');
case 'prices':return `<div class="shop-hero" style="background:#faeeee"><div><h3>미용 가격 안내</h3><p class="muted">견종 분류 × 몸무게 × 서비스</p></div></div><h4 class="section-title">소형견 미용 · 표 일부 예시</h4><div class="line"><span>몸무게</span><b>목욕 / 전체 클리핑</b></div><div class="line"><span>4kg 미만</span><b>15,000 / 35,000</b></div><div class="line"><span>4~6kg 미만</span><b>20,000 / 40,000</b></div><div class="line"><span>6~8kg 미만</span><b>25,000 / 45,000</b></div><p class="muted">전체 표에는 소형견·중형견·특수견, 6개 서비스 열과 ‘얼굴컷 별도’ 주석, 하단 추가금·고양이 미용을 담아요. 분류와 체중에 맞는 셀 가격을 직접 편집합니다.</p><div class="policy">레퍼런스: 연핑크 · 둥근 제목 · 꽃 포인트 · 얇은 가로선. 표의 가격은 참고 이미지 기반 시안이며 실제 매장 가격은 아닙니다.</div><button class="btn block" data-go="designer">표 전체 보기 · 로고와 색 꾸미기</button><a class="btn outline block" href="./pricelist.html">실제 편집 · 다운로드 체험</a>`;
}}
function phone(){const screensheet=['day','booking','newCustomer','payment','expense','priceEdit','share'].includes(state.screen);const root=state.screen==='calendar'||screensheet;const group=['customers','pet'].includes(state.screen)?'customers':['ledger','expense'].includes(state.screen)?'ledger':['shop','prices','priceEdit','share','designer'].includes(state.screen)?'shop':'calendar';return `<div class="phone"><div class="phone-top"><strong>${root?'몽글':pages.find(p=>p.id===state.screen).name}</strong>${root?'<span class="muted">나의 미용실</span>':button('‹ 돌아가기',group==='calendar'?'day':group,'')}</div><div class="phone-main ${root?'calendar':''}">${mainScreen()}</div><nav class="phone-nav" aria-label="시안 앱 메뉴">${[['calendar','▦','예약'],['customers','♧','고객'],['ledger','▤','장부'],['shop','⌂','매장']].map(n=>`<button data-go="${n[0]}" class="${group===n[0]?'active':''}"><b>${n[1]}</b>${n[2]}</button>`).join('')}</nav>${state.screen==='calendar'?button('＋ 예약 등록','booking','fab'):''}${state.screen==='visit'?`<div class="visit-action">${state.stage==='reserved'?`<button class="btn" data-action="start">미용 시작</button><button class="btn soft" data-action="complete">바로 완료</button>`:state.stage==='working'?`<button class="btn soft" data-go="work">작업 기록</button><button class="btn" data-action="complete">미용 완료</button>`:state.paid?button('다음 예약','booking'):button('결제 확인','payment')}</div>`:''}</div>`;}
function prototype(){const p=pages.find(p=>p.id===state.screen);return `<div class="review-title"><div><h2>누르면서 하루의 흐름을 확인하세요.</h2><p>추천: 날짜 → 예약 추가 → 새 고객 → 저장 → 미용 → 완료 → 결제</p></div><button class="btn outline" data-action="reset">시안 초기화</button></div><div class="prototype"><nav class="screen-list" aria-label="시안 화면 선택">${pages.map(s=>`<button class="${s.id===state.screen?'active':''}" data-go="${s.id}"><small>${s.code}</small>${s.name}</button>`).join('')}</nav>${phone()}<aside class="annotation"><span class="eyebrow">${p.code} / ${p.kind}</span><h3>${p.name}</h3><p class="small">${p.purpose}</p><dl><dt>어디서 들어오나요?</dt><dd>${p.entry}</dd><dt>다음 행동은?</dt><dd>${p.action}</dd><dt>화면의 기준</dt><dd>${p.rule}</dd></dl><div class="notice">이 화면은 새 기획의 클릭 시안입니다. 실제 앱 기능·결제 처리가 아니며 입력은 저장되지 않습니다. 날짜·가격·사진 자리는 가상 예시입니다.</div></aside></div>`;}
function decisions(){return `<section class="panel"><span class="eyebrow">04 / POLICIES BEFORE FEATURES</span><h2 style="margin-top:12px">정책을 정한 뒤 화면을 구현합니다.</h2>${[['샴푸 사용료를 기본 추가금으로 넣지 않기','기본 샴푸는 미용 가격에 포함하는 안. 샴푸 구매비는 운영비이며, 원가 참고값이 고객 요금으로 자동 합산되지 않습니다.'],['미용 상태와 결제 상태 분리','예약 확정 → 미용 중 → 미용 완료. 결제는 미결제 → 결제 완료를 독립적으로 관리합니다.'],['확인한 작업만 고객 가격에 더하기','입질·엉킴 등의 추가 작업은 사유·금액과 보호자 확인 여부를 기록합니다. 가격표 변경이 과거 견적을 덮어쓰지 않습니다.'],['신규 고객도 예약 흐름 안에서 등록','고객 메뉴를 오가며 예약을 다시 쓰지 않도록 초안을 유지합니다. 사진과 상세 건강 정보는 나중에 보완할 수 있습니다.'],['사진은 방문에 연결하고 공유 범위를 선택','그날 사진과 지난 스타일을 구분합니다. 보호자에게 전달하는 이미지에 내부 건강·행동 메모를 자동 포함하지 않습니다.'],['기존 기록을 보존하며 이행','현재 앱에는 샴푸 고객 추가금과 동시 결제가 구현되어 있습니다. 새 기획을 적용할 때 과거 결제 금액·사진을 일괄 삭제하거나 임의 변경하지 않습니다.']].map(v=>`<div class="decision"><strong>${v[0]}</strong><p>${v[1]}</p></div>`).join('')}</section><section class="panel"><h3>매장과 확인할 내용</h3><p class="small">실제 가격표의 서비스·견종·체중 기준 / 연락처 없이 받는 예약 유무 / 추가 작업을 확인받는 시점 / 선결제·예약금 필요 여부 / 별도 유료 관리 메뉴 존재 여부.</p><h3 style="margin-top:24px">구현 순서</h3><p class="small">① 이 흐름 검토 → ② 예약·고객 연결 → ③ 미용 완료와 결제 분리 → ④ 가격표·장부 → ⑤ 로그인·기기 간 저장·백업 → ⑥ 직원·네이버 연동.</p><div class="notice">외부 접속 허용 후 켈리독 미용 안내·PetSmart·MoeGo 본문을 확인했습니다. 가격표 디자인의 우선 근거는 사용자가 제공한 이미지이며, 개별 매장 정책을 업계 공통 표준으로 일반화하지 않습니다.</div></section>`;}
function render(){document.getElementById('content').innerHTML=({flow,pages:catalog,prototype,decisions}[currentTab])()+`<footer class="footer"><span>몽글 · 서비스 기획 검토안 · 가상 데이터</span><a href="../">현재 구현된 앱과 비교하기 →</a></footer>`;}
function toast(text){const frame=document.querySelector('.phone');if(!frame)return;frame.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.setAttribute('role','status');n.textContent=text;frame.append(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),4000);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return;}if(b.dataset.go){if(b.dataset.day)state.day=Number(b.dataset.day);if(b.dataset.go==='newCustomer')state.registrationFrom=state.screen==='customers'?'customers':'booking';if(b.dataset.stage){state.stage=b.dataset.stage;state.paid=false;}if(b.dataset.go==='newCustomer'&&state.screen==='booking'){state.time=document.getElementById('booking-time')?.value||state.time;}go(b.dataset.go);return;}const a=b.dataset.action;if(!a)return;switch(a){case 'reset':Object.assign(state,{day:29,registrationFrom:'booking',screen:'calendar',stage:'reserved',paid:false,created:false,ledgerTab:'visits',name:'두부',guardian:'김보호',weight:'6.2',time:'10:00',extra:false,confirmed:false,note:'얼굴은 동그랗게, 귀는 짧게 정리',photos:false});render();break;case 'save-booking':state.time=document.getElementById('booking-time')?.value||state.time;state.created=true;state.stage='reserved';state.paid=false;go('day');toast('가상 예약을 추가했어요. 두부 이름 또는 새 이름을 눌러 계속하세요.');break;case 'save-customer':{const name=document.getElementById('new-name').value.trim(),guardian=document.getElementById('new-guardian').value.trim(),weight=document.getElementById('new-weight').value;if(!name||!guardian||!weight||Number(weight)<=0||Number(weight)>150){toast('이름과 0.1~150kg 몸무게를 입력해 주세요.');return;}state.name=name;state.guardian=guardian;state.weight=weight;go(state.registrationFrom==='customers'?'pet':'booking');toast(state.registrationFrom==='customers'?'고객대장으로 연결되는 흐름입니다.':'예약으로 돌아왔어요. 방금 등록한 아이가 선택돼 있어요.');break;}case 'start':state.stage='working';go('visit');break;case 'complete':state.stage='completed';go('visit');toast('미용은 완료됐고 결제는 아직 미결제예요.');break;case 'save-work':if(document.getElementById('extra-check').checked&&!document.getElementById('confirm-check').checked){toast('추가 작업·금액을 보호자에게 확인한 뒤 체크해 주세요.');return;}state.note=document.getElementById('work-note').value;state.extra=document.getElementById('extra-check').checked;state.confirmed=document.getElementById('confirm-check').checked;go('visit');toast('작업 기록을 반영했어요. 결제는 변하지 않아요.');break;case 'pay':if(state.paid){toast('이미 결제된 가상 방문이에요.');return;}state.stage='completed';state.paid=true;go('visit');toast('가상 결제 확인 → 장부와 방문 이력에 연결되는 흐름입니다.');break;case 'ledger-visits':state.ledgerTab='visits';render();break;case 'ledger-money':state.ledgerTab='money';render();break;case 'save-expense':state.ledgerTab='money';go('ledger');toast('비용 입력 후 월별 장부로 복귀하는 시안입니다. 실제 합계는 저장하지 않아요.');break;case 'photo':state.photos=true;toast('실제 업로드 대신 사진이 방문에 연결되는 위치만 보여줘요.');break;case 'share-note':go('share');break;case 'price-edit-note':go('priceEdit');break;case 'price-save-preview':go('prices');toast('저장 후 화면 예시입니다. 검토용 양식이므로 실제 가격은 변경하지 않았어요.');break;case 'share-final-note':toast('구현 시 이 미리보기를 이미지 저장·기기 공유 화면으로 연결합니다.');break;case 'optional-cost':toast('선택 관리: 제품 단가·사용량 원가. 고객 요금과 별개예요.');break;case 'month-note':toast('월 이동 위치를 보여주는 시안입니다. 달력은 2026년 10월 예시예요.');break;}});
render();
</script></body></html>
