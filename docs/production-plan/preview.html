const portrait=(i=0)=>`<img class="portrait" src="${photos[people[i][4]]}" alt="${people[i][0]} 예시 사진">`;
function navigation(cls){return `<nav class="${cls}" aria-label="${role==='owner'?'사장님':'고객'} 메뉴">${nav().map(([id,title,i])=>`<button data-screen="${id}" ${screen===id?'aria-current="page"':''}>${icon(i)}<span>${title}</span></button>`).join('')}</nav>`;}
function header(title,subtitle,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`;}
function visits(){return people.slice(0,day%3+1).map((p,i)=>`<article class="visit"><button class="visit-open" data-action="visit" data-pet="${i}"><time>${['09:00','11:30','14:00'][i]}</time>${portrait(i)}<span class="visit-info"><strong>${p[0]}</strong><small>${['전체 미용','목욕 · 위생','가위컷'][i]} · ${p[3]}kg<br>${p[2]} · ${p[5]}</small></span></button><div class="visit-bottom"><span class="badge ${day===2||i===0?'done':'wait'}">${day===2?'미용·결제 완료':['미용 중','방문 예정','방문 예정'][i]}</span><b>${['75,000','30,000','85,000'][i]}원</b></div></article>`).join('');}
function calendar(){return header('2026년 11월','예약과 미용, 오늘의 흐름을 한눈에.',`<button class="primary" data-action="new">${icon('plus')}예약 등록</button>`)+`<div class="calendar-layout ${dateOpen?'is-date-open':''} ${agendaClosed?'agenda-hidden':''}"><section class="calendar-section"><div class="toolbar"><div><button class="secondary" data-action="today">오늘</button><div class="seg"><button data-amount="booking" aria-pressed="${amount==='booking'}">예약금액</button><button data-amount="paid" aria-pressed="${amount==='paid'}">받은 금액</button></div></div><span class="small-note">${amount==='booking'?'방문일 기준 · 이달 예약 60건':'결제일 기준 · 이달 결제 3건'}</span></div><div class="weekday">${'일월화수목금토'.split('').map(w=>`<span>${w}</span>`).join('')}</div><div class="month">${Array.from({length:35},(_,i)=>{const d=i+1,n=d>30?0:d%3+1,m=amount==='paid'?(d===2?190000:0):[75000,30000,85000].slice(0,n).reduce((a,b)=>a+b,0);return `<button class="day ${d===day?'selected':''} ${Math.floor(i/7)===Math.floor((day-1)/7)?'selected-week':''}" data-day="${d}" ${d>30?'disabled':''} aria-label="11월 ${d}일 예약 ${n}건"><strong>${d<=30?d:d-30}</strong>${n?`<small>${n}건</small><b>${m.toLocaleString('ko-KR')}</b>`:''}</button>`;}).join('')}</div><button class="text-btn week-close" data-action="month">월간 달력 펼치기</button><p class="line-info">취소한 예약은 건수와 예약금액에서 제외합니다.</p></section><aside class="agenda"><div class="agenda-head"><h2>11월 ${day}일 · 일정</h2><button class="text-btn" data-action="month">일정 닫기</button></div><div class="agenda-money"><span>예약 ${day%3+1}건 · ${day===2?'결제 완료':'미결제 '+(day%3+1)+'건'}</span><strong>${[75000,30000,85000].slice(0,day%3+1).reduce((a,b)=>a+b,0).toLocaleString('ko-KR')}원</strong></div>${visits()}<button class="text-btn" data-action="new">＋ 이 날짜에 예약 등록</button></aside></div>`;}
function customers(){return header('고객 대장','예약 전에 지난 관리와 주의사항을 확인하세요.',`<button class="primary" data-action="new">${icon('plus')}고객 등록</button>`)+`<div class="toolbar"><label class="search">${icon('search')}<input id="customer-search" placeholder="아이·보호자·연락처 검색" aria-label="고객 검색"></label><span class="small-note">반려견 28마리</span></div><table class="table"><thead><tr><th>아이 / 보호자</th><th>최근 방문</th><th class="hide-mobile">주의사항</th><th>다음 예약</th></tr></thead><tbody>${people.map((p,i)=>`<tr data-customer-row="${p[0]}${p[2]}"><td><button class="pet-col" data-action="visit" data-pet="${i}">${portrait(i)}<span>${p[0]}<small>${p[2]} · 예시</small></span></button></td><td>10. 21.<small>${p[3]}kg</small></td><td class="hide-mobile">${p[5]}</td><td>11. ${5+i*3}.<small>11:30</small></td></tr>`).join('')}</tbody></table>`;}
function ledger(){return header('장부','받은 결제와 미결제를 구분해 마감하세요.')+`<div class="toolbar"><div class="seg"><button aria-pressed="true" data-action="paid">받은 결제</button><button data-action="unpaid">미결제</button><button data-action="expenses">매장 지출</button></div><span class="small-note">2026. 11. 02. · 결제일 기준</span></div><div class="summary-line"><span>받은 금액<strong>190,000원</strong></span><span>결제 건수<strong>3건</strong></span><span>미결제<strong>190,000원</strong></span></div><table class="table"><thead><tr><th>시간</th><th>내역</th><th>수단</th><th class="number">금액</th></tr></thead><tbody>${people.map((p,i)=>`<tr><td>${['10:30','12:00','15:00'][i]}</td><td><button data-action="payment" data-pet="${i}">${p[0]}</button><small>${['전체 미용','목욕 · 위생','가위컷'][i]}</small></td><td>${['카드','현금','계좌이체'][i]}</td><td class="number">${['75,000','30,000','85,000'][i]}</td></tr>`).join('')}</tbody></table><p class="line-info">결제 기록을 수정하려면 해당 방문의 정정 이력을 확인합니다.</p>`;}
function settings(){return header('매장관리','요금과 소식을 게시하고 운영 상태를 확인하세요.')+`<div class="settings-list">${[['게시 요금표','초안과 게시본을 비교하고 새 요금을 적용합니다.','ledger','요금표 보기','prices'],['공지 게시판','휴무·예약 변경 안내를 글별로 관리합니다.','shop','목록 보기','notices'],['영업시간과 휴무','예약 가능한 시간과 작업 사이 여유를 설정합니다.','calendar','설정 보기','hours'],['보호자 계정 연결','본인 확인을 마친 고객과 계정을 연결합니다.','users','연결 요청 2','links'],['운영 상태','백업·저장 공간·서비스 상태를 확인합니다.','check','상태 보기','health']].map(([title,body,i,label,action])=>`<section class="settings-row"><div class="setting-icon">${icon(i)}<div><h2>${title}</h2><p>${body}</p></div></div><button class="secondary" data-action="${action}">${label}</button></section>`).join('')}</div>`;}
function prices(){const data=priceGroup?['20,000','25,000','30,000']:['15,000','20,000','25,000'];return header('미용 요금 안내','견종과 몸무게에 맞는 관리 비용을 확인해요.')+`<div class="price-tabs" aria-label="견종 분류"><button data-price="0" aria-pressed="${priceGroup===0}">소형견</button><button data-price="1" aria-pressed="${priceGroup===1}">중형견</button><button data-action="consult">특수견·고양이</button></div><h2 class="section-title">${priceGroup?'중형견':'소형견'} 미용</h2><p class="care-body">서비스별 기본 요금입니다. 추가 작업이 필요하면 먼저 안내해요.</p><table class="table price-table"><thead><tr><th>서비스</th><th>4kg 미만</th><th>4–6kg</th><th>6–8kg</th></tr></thead><tbody>${['목욕','부분 미용','전체 클리핑','가위컷'].map((s,i)=>`<tr><td>${s}</td>${data.map(v=>`<td>${role==='owner'?`<input aria-label="${s} ${v} 구간 가격" style="width:100%;min-width:0;border:1px solid #cbd5ca;border-radius:6px;padding:10px 3px;font-size:13px;text-align:center" value="${Number(v.replace(',',''))+i*15000}">`:(Number(v.replace(',',''))+i*15000).toLocaleString('ko-KR')}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="small-note" style="margin:15px 0 24px">단위: 원 · 이 시안의 금액은 검토용 가상 데이터입니다.</p>${role==='owner'?'<button class="primary" data-action="publish-preview">게시 전 고객 미리보기</button>':`<button class="primary" data-screen="booking">이 조건으로 예약 알아보기 ${icon('arrow')}</button>`}`;}
function booking(){return `<div class="booking-card">${header('방문 예약 신청','신청 내용을 매장에서 확인한 뒤 확정해 드려요.')}<p class="small-note">${step} / 3 · ${step===1?'관리와 시간 선택':step===2?'아이와 연락 정보':'신청 내용 확인'}</p>${step===1?`<label class="field">관리 서비스<select aria-label="관리 서비스"><option>전체 클리핑</option><option>목욕 · 위생 관리</option><option>가위컷</option></select></label><label class="field">방문 날짜<input type="date" value="2026-11-12" aria-label="방문 날짜"></label><h2 class="section-title">가능한 시간</h2><div class="slot-list">${['10:00','11:30','14:00','15:30','17:00','18:00'].map(v=>`<button data-slot="${v}" aria-pressed="${slot===v}">${v}</button>`).join('')}</div><p class="small-note">아직 예약이 확정되거나 결제되지 않았어요.</p>`:step===2?`<label class="field">아이 이름<input value="두부" aria-label="아이 이름"></label><label class="field">견종·몸무게<input value="비숑 프리제 · 6.2kg" aria-label="견종·몸무게"></label><label class="field">보호자 연락처<input placeholder="연락받을 번호" type="tel" aria-label="보호자 연락처"></label>`:`<div class="care-box"><h3>신청 전 확인해 주세요</h3><p class="care-body">11월 12일 · ${slot||'10:00'}<br>두부 · 전체 클리핑<br>매장 확인 후 확정됩니다.</p></div><label class="care-body"><input type="checkbox"> 예약 상담을 위한 정보 수집에 동의합니다.</label>`}<div class="action-row">${step>1?'<button class="secondary" data-action="prev">이전</button>':''}<button class="primary" data-action="next" ${step===1&&!slot?'disabled':''}>${step===3?'신청 흐름 확인':'다음'}</button></div></div>`;}
function notebook(){return `<div class="customer-hero"><p class="small-note">보호자용 미용수첩</p><h1>두부의 관리가<br>차곡차곡 쌓이고 있어요.</h1><p>매장에서 받은 관리와 집에서 챙길 일을 확인해요.</p></div><div class="notice-line">${icon('calendar')}<span>다음 예약 · 11월 12일 목요일 10:00 <b>확정</b></span></div><div class="pet-switch">${portrait()}<div><h2>두부</h2><p>비숑 프리제 · 최근 방문 10월 21일</p></div><button class="text-btn" style="margin-left:auto" data-action="pet">아이 선택</button></div><div class="notebook-layout"><section><h2 class="section-title">지난 미용 모습</h2><div class="photo-pair"><div><img src="${photos.bichon}" alt="미용 전 배치용 예시 사진"><p>미용 전 · 배치 예시</p></div><div><img src="${photos.bichon}" alt="미용 후 배치용 예시 사진"><p>미용 후 · 같은 예시 사진 사용</p></div></div><div class="weight-line"><span>방문 당시 몸무게<br><small>지난 방문 6.3kg</small></span><strong>6.2 <small>kg</small></strong></div></section><section><h2 class="section-title">오늘 남긴 미용 소견</h2><p class="care-body">발끝을 만질 때 잠깐 예민해져 쉬는 시간을 나누어 진행했어요. 얼굴은 둥글게, 귀는 짧게 정리했습니다.</p><div class="care-box"><h3>집에서 이렇게 챙겨 주세요</h3><p class="care-body">산책 후 발을 충분히 말려 주세요.<br>엉킨 털은 억지로 당기지 말고 조금씩 빗겨 주세요.</p></div><button class="text-btn" data-action="history">지난 방문 기록 보기 ${icon('arrow')}</button></section></div>`;}
function render(){document.querySelectorAll('.review-controls [aria-pressed]').forEach(b=>b.setAttribute('aria-pressed',b.id===role||b.id===(document.getElementById('frame').classList.contains('mobile')?'mobile':'desktop')));document.getElementById('app').innerHTML=`<aside class="sidebar"><div class="brand"><b>m</b><span>몽글<small>반려견의 일상을 잇는 기록</small></span></div>${navigation('nav')}<div class="sidebar-foot">${role==='owner'?'우리 매장 · 원장':'우리 아이 · 보호자'}<br>실서비스 UI 검토안</div></aside><div class="workspace"><header class="topbar"><strong>${role==='owner'?'몽글 · 우리 미용실':'몽글 · 반려견 미용수첩'}</strong><span class="role-label">${role==='owner'?'사장님':'보호자'}</span></header><main class="content">${({calendar,customers,ledger,settings,prices,booking,notebook}[screen]||calendar)()}</main>${navigation('bottom-nav')}</div>${role==='owner'&&screen==='calendar'?`<button class="fab" aria-label="예약 등록" data-action="new">${icon('plus')}</button>`:''}`;}
function toast(text){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=text;document.getElementById('app').append(el);setTimeout(()=>el.remove(),4500);}
function drawer(kind,pet=0){const p=people[pet];const mask=document.createElement('div');mask.className='drawer-mask';mask.innerHTML=`<section class="drawer" role="dialog" aria-modal="true" aria-label="${kind==='new'?'예약 등록':'방문 확인'}"><header><h2>${kind==='new'?'예약 등록':'방문 기록'}</h2><button class="close" data-action="close">닫기</button></header><div class="drawer-customer">${portrait(pet)}<div><strong>${p[2]} | ${p[0]} | 1234</strong><br><small>${p[1]} · ${p[3]}kg</small></div></div><span class="badge danger">${p[5]}</span>${kind==='new'?`<label class="field">고객·아이 찾기<input placeholder="이름·연락처 끝자리 검색" aria-label="고객·아이 찾기"></label><label class="field">서비스<select><option>전체 미용</option><option>목욕 · 위생</option><option>가위컷</option></select></label><label class="field">방문 시간<input type="time" value="10:00"></label><p class="line-info">가격은 선택한 아이의 조건과 게시 요금 버전으로 확인합니다.</p><div class="action-row"><button class="primary" data-action="mock-save">예약 흐름 확인</button></div>`:`<div class="care-box"><h3>미용 중 · 결제 전</h3><p class="care-body">전체 미용 · 90분<br>방문 당시 체중 ${p[3]}kg<br>예상 금액 75,000원</p></div><div class="action-row"><button class="secondary" data-action="care">미용 기록 작성</button><button class="primary" data-action="payment">결제 기록</button></div><button class="text-btn" style="color:#a43e3e" data-action="cancel">예약 취소</button>`}</section>`;document.getElementById('app').append(mask);mask.querySelector('.close').focus();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='owner'||b.id==='customer'){role=b.id;screen=role==='owner'?'calendar':'notebook';render();return;}if(b.id==='desktop'||b.id==='mobile'){document.getElementById('frame').classList.toggle('mobile',b.id==='mobile');render();return;}if(b.dataset.screen){screen=b.dataset.screen;step=1;render();return;}if(b.dataset.day){day=Number(b.dataset.day);dateOpen=true;agendaClosed=false;render();return;}if(b.dataset.amount){amount=b.dataset.amount;render();return;}if(b.dataset.price){priceGroup=Number(b.dataset.price);render();return;}if(b.dataset.slot){slot=b.dataset.slot;render();return;}const action=b.dataset.action;if(action==='new'||action==='visit'){drawer(action==='new'?'new':'visit',Number(b.dataset.pet||0));return;}if(action==='close'){document.querySelector('.drawer-mask')?.remove();return;}if(action==='month'){dateOpen=false;agendaClosed=true;render();return;}if(action==='today'){day=5;dateOpen=true;agendaClosed=false;render();return;}if(action==='next'){if(step<3){step++;render();}else toast('시안: 실제 신청은 저장하지 않습니다. 다음 단계는 ‘확정 대기’입니다.');return;}if(action==='prev'){step--;render();return;}if(action==='mock-save'){document.querySelector('.drawer-mask')?.remove();toast('시안: 입력 → 검증 → 서버 저장 확인 → 일정 갱신 흐름입니다.');return;}if(action==='prices'){screen='prices';render();return;}if(action==='publish-preview'){toast('시안: 게시 전 고객 화면·변경 금액·적용 버전을 확인합니다. 실제 게시하지 않습니다.');return;}if(action==='payment'){toast('시안: 아이·최종 금액 → 결제 수단 → 결제일 확인 → 한 번 기록합니다.');return;}if(action==='care'){toast('시안: 전후 사진 → 체중·소견 → 공개 미리보기 → 고객에게 공개합니다.');return;}if(action==='cancel'){toast('시안: 취소 사유와 대상을 확인한 뒤 별도 확정합니다. 닫기와 다른 행동입니다.');return;}if(action)toast(({notices:'시안: 공지 목록 → 글 조회 → 작성·수정·공개 상태를 관리합니다.',hours:'시안: 영업시간·휴무·작업 여유를 설정합니다.',links:'시안: 본인 확인 후 보호자와 고객대장을 연결합니다.',health:'시안: 마지막 백업·복원 점검·저장 공간·오류를 확인합니다.',consult:'시안: 특수견·고양이 요금도 같은 원본에서 분류별로 표시합니다.',history:'시안: 선택한 아이의 공개된 방문만 날짜별로 조회합니다.',pet:'시안: 보호자 계정에 연결된 아이만 선택할 수 있습니다.',unpaid:'시안: 미용 완료와 미결제를 독립적으로 표시합니다.',expenses:'시안: 매장 지출을 결제 수입과 구분해 기록합니다.',paid:'시안: 실제 결제일 기준으로 받은 금액을 조회합니다.'})[action]||'설계 검토용 화면입니다.');});
document.addEventListener('input',e=>{if(e.target.id==='customer-search'){const q=e.target.value.trim();document.querySelectorAll('[data-customer-row]').forEach(row=>row.hidden=!row.dataset.customerRow.includes(q));}});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.drawer-mask')?.remove();});render();
</script></body></html>
